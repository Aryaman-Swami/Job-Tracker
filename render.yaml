services:
  # Spring Boot API + serves the built React app if you ever combine them again.
  - type: web
    name: job-tracker-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: APP_USERNAME
        sync: false # pick a username
      - key: APP_PASSWORD
        generateValue: true # Render generates a strong random password for you; view it in the dashboard
      # Using Supabase Postgres, not Render's managed Postgres -- fill these
      # in from Supabase dashboard -> Project Settings -> Database ->
      # Connection Pooler (use the pooler, not the direct connection; see
      # notes below). DB_USER for the pooler is "postgres.<project-ref>",
      # not just "postgres".
      - key: DB_HOST
        sync: false # e.g. aws-0-ap-south-1.pooler.supabase.com
      - key: DB_PORT
        sync: false # 6543 for transaction-mode pooler (recommended), 5432 for session-mode pooler
      - key: DB_NAME
        value: postgres
      - key: DB_USER
        sync: false # e.g. postgres.abcdefghijklmnop
      - key: DB_PASSWORD
        sync: false # your Supabase database password
      - key: DB_SSLMODE
        value: require
      - key: FRONTEND_ORIGIN
        sync: false # set to your Netlify site URL, e.g. https://job-tracker.netlify.app
      - key: CLAUDE_CODE_OAUTH_TOKEN
        sync: false # from `claude setup-token` run locally
      - key: JWT_SECRET
        sync: false # optional: a random 32+ char string, keeps login sessions valid across redeploys. If unset, every redeploy invalidates existing sessions (users just log in again).
      - key: PYTHON_BIN
        value: python3
